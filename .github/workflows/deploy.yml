name: React CI/CD

on:
  push:
    branches:
      - master

jobs:

  docker:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build image
        run: docker build -t abbas737/react-kurs-isi .

      - name: Push image
        run: |
          docker tag abbas737/react-kurs-isi abbas737/react-kurs-isi:latest
          docker push abbas737/react-kurs-isi:latest
      - name: Deploy EC2
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker pull abbas737/react-kurs-isi:latest
            docker compose down || true
            docker compose up -d